<!--
  Yendidii sign-in code email.
  Paste this into Supabase > Authentication > Email Templates, for BOTH:
    - "Confirm signup"  (what a brand-new email receives)
    - "Magic Link"      (what an existing account receives)
  Suggested subject: Your Yendidii code: {{ .Token }}
  It deliberately has no link: the app asks the person to type the code.
-->
<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#F8E4DD;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8E4DD;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FBF5F2;border-radius:24px;">
            <tr>
              <td style="padding:32px 28px 8px 28px;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;">
                <div style="font-size:22px;font-weight:800;color:#3D251E;letter-spacing:-0.3px;">Yendidii<span style="color:#C25327;">.</span></div>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 28px 0 28px;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;">
                <div style="font-size:24px;line-height:30px;font-weight:700;color:#3D251E;">Your sign-in code</div>
                <div style="font-size:14px;line-height:21px;color:#7A5C53;margin-top:8px;">
                  Enter this code in the app to continue. It works once and expires soon.
                </div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:24px 28px;">
                <div style="background:#F8E4DD;border-radius:16px;padding:20px 12px;font-family:'Courier New',Courier,monospace;font-size:36px;line-height:40px;font-weight:700;letter-spacing:10px;color:#C25327;">
                  {{ .Token }}
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 32px 28px;font-family:'Plus Jakarta Sans',Helvetica,Arial,sans-serif;">
                <div style="font-size:12px;line-height:18px;color:#7A5C53;">
                  Didn't ask for this? You can safely ignore this email. Nobody can get into your account without the code.
                </div>
                <div style="font-size:12px;line-height:18px;color:#7A5C53;margin-top:14px;">Eat. Drink. Socialize.</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
