<div style="background:#FFF4F1;padding:40px 16px;font-family:Helvetica,Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;background:#ffffff;border:1px solid #F2DFD7;border-radius:20px;overflow:hidden;">

    <div style="background:#B14521;padding:30px 24px;text-align:center;">
      <div style="font-size:22px;font-weight:700;color:#ffffff;">Yendidii</div>
      <div style="font-size:13px;color:#ffffff;margin-top:6px;">Let's Eat Together</div>
    </div>

    <div style="padding:32px;">
      <h2 style="margin:0 0 12px 0;font-size:20px;color:#1B1C19;">Your verification code</h2>
      <p style="margin:0 0 24px 0;font-size:14px;line-height:21px;color:#2D241E;">
        Enter this code in the app to finish signing in. It expires shortly, so don't wait too long.
      </p>

      <div style="background:#FFEBE4;border:1px solid #E0B8A8;border-radius:14px;padding:22px 12px;text-align:center;">
        <span style="font-size:32px;font-weight:700;letter-spacing:8px;color:#B14521;">{{ .Token }}</span>
      </div>

      <p style="margin:24px 0 0 0;font-size:13px;line-height:19px;color:#6B544C;">
        Didn't request this? You can safely ignore this email — no account changes will be made.
      </p>
    </div>

    <div style="border-top:1px solid #F2DFD7;padding:18px 24px;text-align:center;font-size:12px;color:#6B544C;">
      © Yendidii. Sent to help you sign in securely.
    </div>
  </div>
</div>
